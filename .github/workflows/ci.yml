name: macOS build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install icon build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: swift test

      - name: Assemble app bundle
        run: ./scripts/build-app.sh

      - name: Upload app bundle
        uses: actions/upload-artifact@v7
        with:
          name: AI-Network-Guard-macOS
          path: dist/ExitWatch.app
